services:
  - type: web
    name: returnly
    runtime: node
    # Starter never sleeps, so the every-minute reminder check keeps running overnight (the free plan sleeps after 15 minutes).
    plan: starter
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    # Answers 503 when reminders stop sending (server/health.js): Render then restarts the service and emails its owner.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: returnly-db
          property: connectionString
      # Photos and receipts go to an S3-compatible bucket (for example Cloudflare R2). Render asks for these values;
      # the server refuses to start in production without them. R2 endpoint: https://<account id>.r2.cloudflarestorage.com
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
      # Reads scanned receipts, sorts items into a store's policy categories and looks up stores we don't have. Without it receipts are saved but not read,
      # and the policy engine still works and uses the shortest window that could apply.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Google Places API (New) key for "Nearest drop-off" on the Return card. Without it the rest of the guide still works and
      # the app says drop-off lookup isn't available.
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      # Web Push for daily reminders when the app is closed. Generate with `npx web-push generate-vapid-keys`. Without them
      # reminders arrive only while the app is open.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Email through Resend: the reminder email backup and password reset links. EMAIL_FROM must be on the sending domain
      # verified in Resend (for example "Returnly <hello@yourdomain.com>"); APP_URL is this site's address, used in
      # email links. EMAIL_TOKEN_SECRET signs those links (any long random string; `openssl rand -hex 32`). Without them
      # there are no emails and "Forgot password?" says reset isn't set up.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_URL
        sync: false
      - key: EMAIL_TOKEN_SECRET
        generateValue: true
      # Care team invites by text through Twilio: the account SID (starts with AC), its auth token and the Twilio number
      # texts come from (+15551234567). Without them invites go by email, and admins can copy the invite link.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      # Each family's plan, paid by card through Stripe: the secret key (sk_live_…) and the signing secret of the webhook
      # pointed at https://<your site>/api/stripe/webhook (events: checkout.session.completed, customer.subscription.*,
      # invoice.*). Without them free trials still run, and Settings → Plan says card payments aren't set up.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Who gets an email when reminders stop sending, and again when they're back (defaults to SUPPORT_EMAIL).
      - key: ALERT_EMAIL
        sync: false
      # The contact address shown on Support, and the reply-to address of emails (for example support@yourdomain.com).
      - key: SUPPORT_EMAIL
        sync: false
      # Comma-separated emails of accounts that may review policies (Settings → Policy review): looked-up stores, "Is this
      # wrong?" reports and changes the weekly freshness check flagged.
      - key: ADMIN_EMAILS
        sync: false
      # Purchases from email and "Continue with Google / Apple" (see README → Purchases from email). Each part is off until
      # its values are set. OAuth redirects and Outlook notifications use APP_URL above.
      # 32 random bytes, base64 (openssl rand -base64 32). Encrypts inbox tokens at rest. Required once any part below is set.
      - key: INBOX_TOKEN_KEY
        sync: false
      # Forwarding, through Resend's inbound email (uses RESEND_API_KEY above): the receiving domain (for example
      # in.returnly.app) and the signing secret of the email.received webhook (whsec_...).
      - key: INBOUND_EMAIL_DOMAIN
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      # Google OAuth client: "Continue with Google" and Gmail connect (read-only). Set GMAIL_VERIFIED=true once Google has
      # verified the app; until then Gmail connect is in testing mode (up to 100 test users).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GMAIL_VERIFIED
        value: "false"
      # Microsoft app registration: Outlook connect (Mail.Read).
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      # Sign in with Apple: Services ID, team id, key id and the .p8 private key (newlines as \n).
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false

databases:
  # A paid Postgres: it doesn't expire, and Render keeps backups of it (point-in-time recovery and daily exports).
  - name: returnly-db
    plan: basic-256mb
    databaseName: returnly
