services:
  - type: web
    name: returnly
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: returnly-db
          property: connectionString
      # Photos and receipts go to an S3-compatible bucket (for example Cloudflare R2). Render asks for these values;
      # the server refuses to start in production without them. R2 endpoint: https://<account id>.r2.cloudflarestorage.com
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
      # Reads scanned receipts, sorts items into a store's policy categories and looks up stores we don't have. Without it receipts are saved but not read,
      # and the policy engine still works and uses the shortest window that could apply.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Google Places API (New) key for "Nearest drop-off" on the Return card. Without it the rest of the guide still works and
      # the app says drop-off lookup isn't available.
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      # Web Push for daily reminders when the app is closed. Generate with `npx web-push generate-vapid-keys`. Without them
      # reminders arrive only while the app is open.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Comma-separated emails of accounts that may review policies (Settings → Policy review): looked-up stores, "Is this
      # wrong?" reports and changes the weekly freshness check flagged.
      - key: ADMIN_EMAILS
        sync: false

databases:
  # Render's free Postgres expires after 30 days. Switch to a paid plan before real users rely on it.
  - name: returnly-db
    plan: free
    databaseName: returnly
